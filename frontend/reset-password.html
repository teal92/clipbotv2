<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ClipBot · Password Recovery</title><link rel="stylesheet" href="/css/clipbot.css"><link rel="stylesheet" href="/css/account-profile.css"><link rel="stylesheet" href="/css/password-policy.css"><script type="module" src="/js/account-recovery.js"></script></head><body><main class="workspace-page"><section class="workspace-card auth-card"><span class="eyebrow">YOUR CLIPBOT ACCOUNT</span><h1>Password Recovery</h1><form data-forgot-password class="account-form"><label>Email address<input type="email" name="email" autocomplete="email" required maxlength="254"></label><p>If recovery email is configured for your account, we will send a link that expires in 15 minutes.</p><button class="btn approve" type="submit">Request Reset Link</button></form><form data-reset-password class="account-form" hidden><label>New password<input id="recovery-new-password" data-password-policy pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^a-zA-Z0-9\s]).{12,128}" type="password" name="newPassword" autocomplete="new-password" minlength="12" maxlength="128" required></label><div data-recovery-password-rules></div><label>Confirm new password<input type="password" name="confirmation" autocomplete="new-password" minlength="12" maxlength="128" required></label><p>Use a unique password that meets the checklist. This disconnects all other sessions and local workers.</p><button class="btn approve" type="submit">Reset Password</button></form><p data-recovery-status role="status" aria-live="polite"></p><a href="/">Back to Sign In</a></section></main></body></html>
